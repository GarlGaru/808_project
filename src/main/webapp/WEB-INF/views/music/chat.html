<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music AI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Noto Sans KR',sans-serif;background:#1e1e1e;color:#ddd}

#ai-chat-container{
  display:flex;flex-direction:column;height:100%;
  max-width:700px;margin:0 auto;
}

/* 메시지 영역 */
#ai-chat-messages{
  flex:1;overflow-y:auto;padding:32px 20px;
  display:flex;flex-direction:column;gap:16px;
}
#ai-chat-messages::-webkit-scrollbar{width:5px}
#ai-chat-messages::-webkit-scrollbar-thumb{background:#444;border-radius:3px}

/* 유저 메시지 */
.ai-chat-user{
  align-self:flex-end;
  background:#333;padding:10px 16px;border-radius:16px 16px 4px 16px;
  max-width:80%;font-size:14px;line-height:1.6;
}

/* 봇 메시지 */
.ai-chat-bot{
  align-self:flex-start;
  max-width:85%;font-size:14px;line-height:1.6;
}

/* 곡 카드 */
.ai-chat-songs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ai-chat-card{
  background:#292929;border:1px solid #3a3a3a;border-radius:10px;
  padding:10px 14px;
}
.ai-chat-card:hover{border-color:#7b6fda}
.ai-chat-card-title{font-weight:600;font-size:13px}
.ai-chat-card-meta{color:#888;font-size:12px;margin-top:2px}
.ai-chat-card-genres{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.ai-chat-card-genres span{
  font-size:10px;padding:2px 8px;border-radius:8px;
  background:rgba(123,111,218,.15);color:#9b8ff5;
}

/* 타이핑 */
.ai-chat-dots{display:flex;gap:5px;padding:6px 0;align-self:flex-start}
.ai-chat-dots i{
  width:7px;height:7px;border-radius:50%;background:#555;
  display:block;animation:ai-chat-bop .8s infinite;
}
.ai-chat-dots i:nth-child(2){animation-delay:.12s}
.ai-chat-dots i:nth-child(3){animation-delay:.24s}
@keyframes ai-chat-bop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* 입력 */
#ai-chat-input-wrap{
  padding:10px 20px 24px;
}
#ai-chat-input-bar{
  display:flex;align-items:center;gap:8px;
  background:#2b2b2b;border:1px solid #444;border-radius:14px;
  padding:10px 14px;
}
#ai-chat-input-bar:focus-within{border-color:#7b6fda}
#ai-chat-msg{
  flex:1;background:none;border:none;outline:none;resize:none;
  color:#ddd;font-family:inherit;font-size:14px;line-height:1.5;
  max-height:100px;
}
#ai-chat-msg::placeholder{color:#666}
#ai-chat-send{
  width:34px;height:34px;border:none;border-radius:10px;
  background:#7b6fda;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
#ai-chat-send:disabled{opacity:.3;cursor:default}
</style>
</head>
<body>

<div id="ai-chat-container">
  <div id="ai-chat-messages"></div>
  <div id="ai-chat-input-wrap">
    <div id="ai-chat-input-bar">
      <textarea id="ai-chat-msg" rows="1" placeholder="메시지를 입력하세요..."></textarea>
      <button id="ai-chat-send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  var API_URL = '/api/ai/chat';
  var box = document.getElementById('ai-chat-messages');
  var ta  = document.getElementById('ai-chat-msg');
  var btn = document.getElementById('ai-chat-send');
  var busy = false;

  ta.oninput = function(){
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 100) + 'px';
  };

  ta.onkeydown = function(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); go(); }
  };
  btn.onclick = go;

  function go(){
    var t = ta.value.trim();
    if(!t || busy) return;
    addMsg('ai-chat-user', t);
    ta.value = ''; ta.style.height = 'auto';
    busy = true; btn.disabled = true;
    var dots = addDots();

    fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: t})
    })
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ dots.remove(); renderBot(d); })
    .catch(function(e){ dots.remove(); addMsg('ai-chat-bot','오류가 발생했습니다. ('+e.message+')'); })
    .finally(function(){ busy=false; btn.disabled=false; });
  }

  function addMsg(cls, txt){
    var d = document.createElement('div');
    d.className = cls;
    d.textContent = txt;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }

  function renderBot(data){
    var wrap = document.createElement('div');
    wrap.className = 'ai-chat-bot';

    if(data.reply){
      var p = document.createElement('div');
      p.textContent = data.reply;
      wrap.appendChild(p);
    }

    if(data.songs && data.songs.length){
      var list = document.createElement('div');
      list.className = 'ai-chat-songs';
      data.songs.forEach(function(s){
        var c = document.createElement('div');
        c.className = 'ai-chat-card';
        var h = '<div class="ai-chat-card-title">'+esc(s.song_title)+'</div>';
        h += '<div class="ai-chat-card-meta">'+esc(s.artist_name)+' · '+esc(s.album_title)+'</div>';
        if(s.genres && s.genres.length){
          h += '<div class="ai-chat-card-genres">';
          s.genres.forEach(function(g){ h += '<span>'+esc(g)+'</span>'; });
          h += '</div>';
        }
        c.innerHTML = h;
        list.appendChild(c);
      });
      wrap.appendChild(list);
    }

    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
  }

  function addDots(){
    var d = document.createElement('div');
    d.className = 'ai-chat-dots';
    d.innerHTML = '<i></i><i></i><i></i>';
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
    return d;
  }

  function esc(s){
    var d = document.createElement('div');
    d.textContent = s||'';
    return d.innerHTML;
  }
})();
</script>
</body>
</html>
